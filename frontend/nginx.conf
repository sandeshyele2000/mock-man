server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Keep redirects relative so external HTTPS/custom ports survive a proxy.
  absolute_redirect off;

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    try_files $uri =404;
  }

  location = /runtime-config.js {
    try_files $uri =404;
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
