                $ref: '#/components/schemas/ProjectMutationResult'
        '400':
          description: Malformed JSON or invalid identifier
        '403':
          description: Admin origin or mutation header rejected
        '404':
          description: Parent or resource not found
        '409':
          description: Stale project version or project already exists
        '413':
          description: Payload exceeds the configured response or import limit
        '422':
          description: Invalid project or dangling scenario reference
        '500':
          description: Storage unavailable
  /api/limits:
    get:
      responses:
        '200':
          description: Configured payload limits in bytes
          content:
            application/json:
              schema:
                type: object
                required:
                  - responseBytes
                  - importBytes
                  - metadataBytes
                properties:
                  responseBytes:
                    type: integer
                  importBytes:
                    type: integer
                  metadataBytes:
                    type: integer
                  scenarioBytes:
                    type: integer
        '403':
          description: Admin origin rejected
components:
  schemas:
    ProjectMutationResult:
      type: object
      required:
        - version
        - workspaceVersion
      properties:
        version:
          type: integer
          format: int64
        workspaceVersion:
          type: integer
          format: int64
          description: Version for compatibility with the legacy workspace API.
        value:
          anyOf:
            - $ref: '#/components/schemas/Project'
            - $ref: '#/components/schemas/Feature'
            - $ref: '#/components/schemas/Endpoint'
            - $ref: '#/components/schemas/Response'
            - $ref: '#/components/schemas/Scenario'
            - $ref: '#/components/schemas/ProjectMetadata'
            - $ref: '#/components/schemas/FeatureMetadata'
            - $ref: '#/components/schemas/EndpointMetadata'
        versions:
          type: object
          additionalProperties:
            type: object
            properties:
              version:
                type: integer
                format: int64
              metadataVersion:
                type: integer
                format: int64
        revisions:
          type: object
          additionalProperties:
            type: string
          description: >-
            Current runtime revisions for the affected endpoint. These do not advance scenario
            content edit tokens.
        stale:
          type: boolean
          description: >-
            Concurrent ancestor changes were not included in this mutation. Refresh the workspace
            before bulk replacement or deletion.
      additionalProperties: false
    Config:
      type: object
      required:
        - version
        - projects
      properties:
        version:
          type: integer
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
      additionalProperties: false
    Project:
      type: object
      required:
        - id
        - name
        - environments
        - features
      properties:
        version:
          type: integer
          format: int64
          description: Subtree version for full replacement, deletion, and atomic batches.
        id:
          type: string
        name:
          type: string
        environments:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
        metadataVersion:
          type: integer
          format: int64
          description: Optimistic token for metadata-only PATCH requests.
      additionalProperties: false
    Feature:
      type: object
      required:
        - id
        - name
        - endpoints
      properties:
        mockingDisabled:
          type: boolean
          description: Pause mocking without changing individual endpoint settings.
        id:
          type: string
        name:
          type: string
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
        version:
          type: integer
          format: int64
          description: Subtree version for full replacement, deletion, and atomic batches.
        metadataVersion:
          type: integer
          format: int64
          description: Optimistic token for metadata-only PATCH requests.
      additionalProperties: false
    Endpoint:
      type: object
      required:
        - id
        - name
        - method
        - path
        - enabled
        - responses
        - scenarios
        - active
      properties:
        id:
          type: string
        name:
          type: string
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - HEAD
            - OPTIONS
        path:
          type: string
        enabled:
          type: boolean
        responses:
          type: array
          items:
            $ref: '#/components/schemas/Response'
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/Scenario'
        active:
          type: object
          additionalProperties:
            type: string
        version:
          type: integer
          format: int64
          description: Subtree version for full replacement, deletion, and atomic batches.
        metadataVersion:
          type: integer
          format: int64
          description: Optimistic token for metadata-only PATCH requests.
      additionalProperties: false
    Response:
      type: object
      required:
        - id
        - name
        - status
        - headers
        - body
        - delayMs
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: integer
        headers:
          type: object
          additionalProperties:
            type: string
        body: {}
        delayMs:
          type: integer
        version:
          type: integer
          format: int64
          description: Optimistic entity version.
      additionalProperties: false
    Condition:
      type: object
      required:
        - source
        - key
        - value
      properties:
        source:
          type: string
          enum:
            - query
            - header
            - body
        key:
          type: string
        value:
          type: string
      additionalProperties: false
    Scenario:
      type: object
      required:
        - id
        - name
        - revision
        - behavior
        - count
        - responseIds
        - exhaustion
        - priority
        - conditions
      properties:
        id:
          type: string
        name:
          type: string
        revision:
          type: string
        behavior:
          type: string
          enum:
            - always
            - failFirst
            - failAfter
            - sequence
            - flow
            - javascript
        count:
          type: integer
        responseIds:
          type: array
          items:
            type: string
        exhaustion:
          type: string
          enum:
            - repeat
            - loop
        priority:
          type: integer
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        flow:
          $ref: '#/components/schemas/FlowGraph'
        code:
          type: string
        version:
          type: integer
          format: int64
          description: >-
            Optimistic token for scenario content; response-driven runtime revision changes do not
            advance this token.
      additionalProperties: false
    FlowGraph:
      type: object
      required:
        - startNodeId
        - nodes
        - connections
      properties:
        startNodeId:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/FlowNode'
        connections:
          type: array
          items:
            $ref: '#/components/schemas/FlowConnection'
      additionalProperties: false
    FlowNode:
      type: object
      required:
        - id
        - type
        - x
        - 'y'
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - start
            - response
            - javascript
            - end
        x:
          type: integer
        'y':
          type: integer
        responseId:
          type: string
        code:
          type: string
        outputs:
          type: array
          items:
            type: string
      additionalProperties: false
    FlowConnection:
      type: object
      required:
        - id
        - source
        - target
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        sourcePort:
          type: string
      additionalProperties: false
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
      additionalProperties: false
    RequestPayload:
      type: object
      required:
        - body
        - encoding
        - contentType
        - sizeBytes
        - truncated
      properties:
        body:
          type: string
          description: Original body text, or base64 for binary payloads. Capture is limited to 64 KiB.
        encoding:
          type: string
          enum:
            - utf-8
            - base64
        contentType:
          type: string
        sizeBytes:
          type: integer
          description: Full request body size before capture truncation.
        truncated:
          type: boolean
      additionalProperties: false
    LogDetail:
      type: object
      required:
        - method
        - path
        - endpoint
        - scenario
        - revision
        - session
        - attempt
        - status
        - delayMs
        - reason
      properties:
        feature:
          type: string
          description: Feature identifier. Optional for older clients and logs.
        payload:
          $ref: '#/components/schemas/RequestPayload'
        method:
          type: string
        path:
          type: string
        endpoint:
          type: string
        scenario:
          type: string
        revision:
          type: string
        session:
          type: string
        attempt:
          type: integer
        status:
          type: integer
        delayMs:
          type: integer
        reason:
          type: string
      additionalProperties: false
    Log:
      type: object
      required:
        - id
        - createdAt
        - detail
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        detail:
          $ref: '#/components/schemas/LogDetail'
      additionalProperties: false
    Reset:
      type: object
      required:
        - project
        - environment
        - session
        - endpoint
      properties:
        project:
          type: string
        environment:
          type: string
        session:
          type: string
        endpoint:
          type: string
      additionalProperties: false
    TryRequest:
      type: object
      required:
        - project
        - environment
        - session
        - scenario
        - method
        - path
        - headers
        - body
      properties:
        feature:
          type: string
          description: Feature identifier. Optional for older clients and logs.
        project:
          type: string
        environment:
          type: string
        session:
          type: string
        scenario:
          type: string
        method:
          type: string
        path:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
      additionalProperties: false
    TryResult:
      type: object
      required:
        - status
        - headers
        - body
        - elapsedMs
      properties:
        status:
          type: integer
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        body:
          type: string
        elapsedMs:
          type: integer
      additionalProperties: false
    ProjectMetadata:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        name:
          type: string
        environments:
          type: array
          items:
            type: string
      additionalProperties: false
    FeatureMetadata:
      type: object
      required:
        - id
      properties:
        mockingDisabled:
          type: boolean
          description: Pause mocking without changing individual endpoint settings.
        id:
          type: string
        name:
          type: string
      additionalProperties: false
    EndpointMetadata:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        name:
          type: string
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - HEAD
            - OPTIONS
        path:
          type: string
        enabled:
          type: boolean
        active:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false
    EndpointChanges:
      type: object
      required:
        - version
        - changes
      properties:
        version:
          type: integer
          format: int64
        active:
          type: object
          additionalProperties:
            type: string
        changes:
          type: array
          maxItems: 200
          items:
            type: object
            required:
              - kind
              - id
              - version
            properties:
              kind:
                type: string
                enum:
                  - response
                  - scenario
              id:
                type: string
              version:
                type: integer
                format: int64
              value:
                oneOf:
                  - $ref: '#/components/schemas/Response'
                  - $ref: '#/components/schemas/Scenario'
              delete:
                type: boolean
            additionalProperties: false
        ancestors:
          type: object
          additionalProperties:
            type: integer
            format: int64
        metadataVersion:
          type: integer
          format: int64
          description: Required when active selections are supplied, to guard against stale endpoint metadata.
      additionalProperties: false
