        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin origin or mutation header rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Storage unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TryRequest'
  /api/projects/{project}:
    parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
    get:
      responses:
        '200':
          description: Project document and current project version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
    put:
      description: >-
        Create or replace this project. version is the entity version for responses/scenarios and
        the subtree version for containers. Use zero only to create a new entity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - value
              properties:
                version:
                  type: integer
                  format: int64
                  description: >-
                    Current version of this entity; subtree version for container replacement or
                    deletion. Zero creates a new entity.
                value:
                  $ref: '#/components/schemas/Project'
                ancestors:
                  type: object
                  additionalProperties:
                    type: integer
                    format: int64
                  description: >-
                    Known project, feature/<id>, endpoint/<id> subtree versions. Unknown ancestors
                    are not advanced and the result requests a refresh.
              additionalProperties: false
      responses:
        '200':
          description: Updated project version and saved entity without unrelated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMutationResult'
        '400':
          description: Malformed JSON or invalid identifier
        '403':
          description: Admin origin or mutation header rejected
        '404':
          description: Parent or resource not found
        '409':
          description: Stale project version or project already exists
        '413':
          description: Payload exceeds the configured response or import limit
        '422':
          description: Invalid project or dangling scenario reference
        '500':
          description: Storage unavailable
    delete:
      description: >-
        Delete this project. version is the entity version for responses/scenarios and the subtree
        version for containers. Use zero only to create a new entity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              properties:
                version:
                  type: integer
                  format: int64
                  description: >-
                    Current version of this entity; subtree version for container replacement or
                    deletion. Zero creates a new entity.
                ancestors:
                  type: object
                  additionalProperties:
                    type: integer
                    format: int64
                  description: >-
                    Known project, feature/<id>, endpoint/<id> subtree versions. Unknown ancestors
                    are not advanced and the result requests a refresh.
              additionalProperties: false
      responses:
        '200':
          description: Updated project version and saved entity without unrelated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMutationResult'
        '400':
          description: Malformed JSON or invalid identifier
        '403':
          description: Admin origin or mutation header rejected
        '404':
          description: Parent or resource not found
        '409':
          description: Stale project version or project already exists
        '413':
          description: Payload exceeds the configured response or import limit
        '422':
          description: Invalid project or dangling scenario reference
        '500':
          description: Storage unavailable
    patch:
      description: >-
        Update only metadata without resending child entities. Requires metadataVersion in the
        version field. Request limit 1 MiB. Omitted metadata fields are preserved; null values are
        rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - value
              properties:
                version:
                  type: integer
                  format: int64
                  description: >-
                    Current version of this entity; subtree version for container replacement or
                    deletion. Zero creates a new entity.
                value:
                  $ref: '#/components/schemas/ProjectMetadata'
                ancestors:
                  type: object
                  additionalProperties:
                    type: integer
                    format: int64
                  description: >-
                    Known project, feature/<id>, endpoint/<id> subtree versions. Unknown ancestors
                    are not advanced and the result requests a refresh.
              additionalProperties: false
      responses:
        '200':
          description: Updated project version and saved entity without unrelated configuration
