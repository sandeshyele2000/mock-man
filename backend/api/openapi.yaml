openapi: 3.1.0
info:
  title: Mockman admin API
  version: 2.0.0
  description: >-
    Same-origin local admin API. Mutations require Content-Type: application/json and
    X-Mockman-Admin: 1. Mock listener preserves application paths. X-Mock-Feature selects a feature;
    omitting it returns HTTP 409 if multiple enabled features contain the same method and path. See
    README for runtime headers.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/config:
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin origin or mutation header rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Storage unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin origin or mutation header rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stale configuration version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Bulk import exceeds MAX_IMPORT_MIB
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Storage unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
      description: >-
        Explicit whole-workspace import/replacement. The dashboard uses targeted entity routes
        instead. Requires the workspace version.
  /api/logs:
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Log'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin origin or mutation header rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Storage unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - in: query
          name: project
          required: true
          schema:
            type: string
        - in: query
          name: environment
          required: true
          schema:
            type: string
  /api/reset:
    post:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
                additionalProperties: false
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin origin or mutation header rejected
          content:
